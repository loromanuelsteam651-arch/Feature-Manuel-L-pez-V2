<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Portafolio personal de Manuel López estudiante the bridge desarrollador web con IA">
    <title>Portafolio de Manuel López</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
      <script src="./js/script.js" defer></script>
</head>
<body class="contacto-body">
    <header id="mainHeader"></header>

    <main class="contacto-main">

        <section>
            <h1>Contacto</h1>
            <form action="#" method="post">
                <fieldset>
                    <legend class="legend"> <strong>Datos personales</strong> </legend>

                        <div class="form">
                            <label for="nombre">Nombre:</label>
                            <input placeholder="Tu nombre" type="text" id="nombre" name="nombre" required>
                        </div>

                        <div class="form">
                            <label for="email">Correo electrónico:</label>
                            <input placeholder="Tu@email.com..." type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form">
                            <label for="asunto">Asunto:</label>
                            <input placeholder="Escribe el asunto de tu asunto aquí..." type="text" id="asunto" name="asunto" required>
                        </div>

                        <div class="form">
                          <label for="mensaje">Mensaje:</label>
                        
                          <textarea
                            id="mensaje"
                            name="mensaje"
                            rows="5"
                            placeholder="Escribe tu mensaje aquí..."
                            required
                          ></textarea>
                        </div>
                         <button class="contac-btn-primary" type="submit">Enviar</button>
                <button  class="contac-btn-primary" type="reset">Borrar formulario</button>
                </fieldset>

                            
               
                </form>
        </section>

        

    </main>

  <footer id="mainFooter"></footer>
     <script type="module" src="./js/main.js"></script>
  </body>
</html>
